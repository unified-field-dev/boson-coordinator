name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting check
        run: cargo fmt --all -- --check
      - name: Clippy
        # remote-http pulls private deathbreakfast/soliton; exercise axum without it.
        run: cargo clippy --all-targets --features axum -- -D warnings
      - name: Test
        # Serialize: shared OnceLock registry/queue fixtures can flake under parallel cargo test.
        run: cargo test --features axum -- --test-threads=1
      - name: cargo doc
        run: cargo doc --no-deps --features axum
        env:
          RUSTDOCFLAGS: "-D warnings"
